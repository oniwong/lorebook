# TLS termination for Lorebook. Certificate and key come from the internal CA and are mounted
# from the host at /etc/lorebook/tls (lorebook.crt = server cert + intermediates, lorebook.key).
# After replacing them: docker compose exec nginx nginx -s reload

server_tokens off;

server {
    listen 80 default_server;
    server_name _;
    location = /healthz { proxy_pass http://app:3000; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/lorebook.crt;
    ssl_certificate_key /etc/nginx/tls/lorebook.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # No limit here (spec §7). Uploads stream straight through to the app, which enforces the
    # optional per-file cap admins set under Admin > Settings and stops reading as soon as it is hit.
    client_max_body_size 0;
    proxy_request_buffering off;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

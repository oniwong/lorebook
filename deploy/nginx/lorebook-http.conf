# Plain-HTTP config for Lorebook, for testing at home or in a lab without a certificate.
# NOT for production: passwords and session cookies travel unencrypted.
# Used only when docker-compose.http.yml is layered on top (see README "Running without a certificate").

server_tokens off;

server {
    listen 80 default_server;
    server_name _;

    # Same as the TLS config: no upload limit here, the app enforces the optional admin cap.
    client_max_body_size 0;
    proxy_request_buffering off;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 300s;
    }
}

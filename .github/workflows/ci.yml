name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.16-bookworm
        env:
          POSTGRES_USER: lorebook
          POSTGRES_PASSWORD: lorebook
          POSTGRES_DB: lorebook_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lorebook" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://lorebook:lorebook@localhost:5432/lorebook_test
      - run: npm run build
      - name: Frontend references no external URLs
        run: npm run check:offline

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lorebook-app:ci .

# Lorebook: nginx (TLS) -> app (Node) -> postgres. Settings come from .env (see .env.example).
name: lorebook

services:
  postgres:
    image: postgres:16.16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: lorebook
      POSTGRES_USER: lorebook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lorebook -d lorebook"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: lorebook-app:${LOREBOOK_VERSION:-0.1.0}
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://lorebook:${POSTGRES_PASSWORD}@postgres:5432/lorebook
      BASE_URL: ${BASE_URL:?Set BASE_URL in .env}
      CHECKOUT_TIMEOUT_MINUTES: ${CHECKOUT_TIMEOUT_MINUTES:-120}
      SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-12}
      MIN_FREE_DISK_MB: ${MIN_FREE_DISK_MB:-1024}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ${DATA_DIR:-lorebook-data}:/data

  nginx:
    image: nginx:1.30.6-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/lorebook.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_DIR:-/etc/lorebook/tls}:/etc/nginx/tls:ro

volumes:
  pgdata:
  lorebook-data:
